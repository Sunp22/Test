# Place at .github/workflows/build.yml (replaces the old one)
name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Minecraft 1.21.x needs Java 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # Compiles ONLY the small Fantasy->Infiniverse shim in patcher/ (not the decompiled source)
      - name: Build Fantasy->Infiniverse shim
        run: gradle -p patcher build --no-daemon --stacktrace

      # Finds the original turnbattle jar in the repo and overlays the shim onto it
      - name: Patch original Turn Battle jar
        run: python3 patcher/scripts/merge.py --patcher-jar "patcher/build/libs/turnbattle-infiniverse-patch-*.jar" --out dist

      - name: Upload patched mod jar
        uses: actions/upload-artifact@v4
        with:
          name: turnbattle-infiniverse-jar
          path: dist/*.jar
          if-no-files-found: error
